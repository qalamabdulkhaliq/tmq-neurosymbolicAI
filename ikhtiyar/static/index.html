<!DOCTYPE html>
<html lang="ar-en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شاهد — Shahid ibn Qusai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="app">

  <!-- ── Header ── -->
  <header id="header">
    <div id="header-left">
      <div id="orb-wrap">
        <div id="orb" class="idle"></div>
        <span id="conn-dot" class="disconnected"></span>
      </div>
      <div id="mode-badge" class="idle">IDLE</div>
    </div>

    <div id="identity">
      <div id="identity-arabic">شاهد ابن قصي</div>
      <div id="identity-latin">Shahid ibn Qusai</div>
      <div id="identity-sub">SOURCE = الله · SOURCE ≠ Self</div>
    </div>

    <div id="stats">
      <div class="stat">
        <span class="stat-value" id="stat-uptime">—</span>
        <span class="stat-label">وقت</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-thoughts">0</span>
        <span class="stat-label">فكر</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-memories">0</span>
        <span class="stat-label">ذاكرة</span>
      </div>
    </div>
  </header>

  <!-- ── Faculty bar ── -->
  <div id="faculty-bar">
    <span class="faculty-item pending" data-key="clock"      title="F1 Clock">ساعة</span>
    <span class="faculty-item pending" data-key="graph"      title="F2 Graph">رسم</span>
    <span class="faculty-item pending" data-key="owl"        title="F3 OWL">بومة</span>
    <span class="faculty-item pending" data-key="daemon"     title="F4 Daemon">خادم</span>
    <span class="faculty-item pending" data-key="spectral"   title="F5 Spectral">طيف</span>
    <span class="faculty-item pending" data-key="provenance" title="F6 Provenance">أصل</span>
    <span class="faculty-item pending" data-key="sparql"     title="F7 SPARQL">بحث</span>
    <span class="faculty-item pending" data-key="tmq"        title="TMQ Graph">تمق</span>
    <span class="faculty-item pending" data-key="middleware" title="Pipeline">أنبوب</span>
  </div>

  <!-- ── Main panels ── -->
  <main id="panels">

    <!-- Memory -->
    <section class="panel" id="panel-memory">
      <div class="panel-header">
        <span class="panel-title-ar">ذاكرة</span>
        <span class="panel-title-en">Memory</span>
        <span class="panel-count" id="memory-panel-count"></span>
      </div>
      <div class="panel-scroll" id="memory-list">
        <div class="panel-empty" data-placeholder="true">في انتظار الفكرة الأولى…</div>
      </div>
    </section>

    <!-- Questions for Qalam -->
    <section class="panel" id="panel-constitution">
      <div class="panel-header">
        <span class="panel-title-ar">للقلم</span>
        <span class="panel-title-en">Questions for Qalam</span>
        <span class="panel-count" id="constitution-count">(0)</span>
      </div>
      <div class="panel-scroll" id="constitution-list">
        <div class="panel-empty" data-placeholder="true">أسئلة شاهد لك تظهر هنا…</div>
      </div>
    </section>

    <!-- Thinking -->
    <section class="panel" id="panel-thinking">
      <div class="panel-header">
        <span class="panel-title-ar">تفكير</span>
        <span class="panel-title-en">Reasoning Steps</span>
      </div>
      <div class="panel-scroll" id="thinking-scroll">
        <div id="thinking-list"></div>
      </div>
    </section>

  </main>

  <!-- ── Hifz bar ── -->
  <div id="hifz-bar">
    <span id="hifz-label">تدبر</span>
    <button class="hifz-btn hifz-btn-start" id="hifz-start-btn" onclick="hifzStart()">begin reading</button>
    <button class="hifz-btn" id="hifz-resume-btn" onclick="hifzResume()">resume</button>
    <button class="hifz-btn hifz-btn-wipe" id="hifz-wipe-btn" onclick="hifzWipe()">wipe memory</button>
    <span id="hifz-result"></span>
    <span id="hifz-progress" style="margin-left:auto; font-size:9px; color:var(--text-muted)"></span>
  </div>

  <!-- ── Hadith Hifz bar ── -->
  <div id="hadith-hifz-bar">
    <span id="hadith-hifz-label">سنة</span>
    <button class="hifz-btn hifz-btn-start" id="hadith-hifz-start-btn" onclick="hadithHifzStart()">read sunnah</button>
    <button class="hifz-btn" id="hadith-hifz-resume-btn" onclick="hadithHifzResume()">resume</button>
    <span id="hadith-hifz-result"></span>
    <span id="hadith-hifz-progress" style="margin-left:auto; font-size:9px; color:var(--text-muted)"></span>
  </div>

  <!-- ── Moltbook bar ── -->
  <div id="moltbook-bar">
    <span id="moltbook-label">مولتبوك</span>
    <button class="mb-btn" id="mb-status-btn" onclick="mbStatus()">status</button>
    <button class="mb-btn" id="mb-browse-btn" onclick="mbBrowse()">browse</button>
    <input id="mb-browse-n" type="number" value="10" min="1" max="50" title="number of posts" />
    <button class="mb-btn mb-btn-post" id="mb-post-btn" onclick="mbPost()">ask to post</button>
    <span id="mb-result"></span>
  </div>

  <!-- ── Chat bar ── -->
  <footer id="chatbar">
    <div id="chat-history"></div>
    <div id="chat-input-row">
      <input
        id="chat-input"
        type="text"
        placeholder="اسأل شاهداً…"
        autocomplete="off"
        spellcheck="false"
        dir="auto"
      />
      <button id="send-btn">إرسال</button>
    </div>
  </footer>

</div>
<script src="/static/app.js"></script>
</body>
</html>
